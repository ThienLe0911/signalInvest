services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: signalinvest_app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.7-flash}
      - GEMINI_ENABLE_GOOGLE_SEARCH=${GEMINI_ENABLE_GOOGLE_SEARCH:-true}
    env_file:
      - path: .env.local
        required: false
      - path: .env
        required: false
    volumes:
      - daily_reports_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/market || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  daily_reports_data:
    name: signalinvest_data
